 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Home</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
        }
        h1 { margin-top: 0; color: #1e3a8a; font-size: 24px; text-align: center; }
        p { color: #6b7280; font-size: 14px; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #374151; margin-bottom: 6px; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #2563eb; }
        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }
        .location-section {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .location-text { font-size: 13px; color: #475569; }
        .location-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .location-btn:hover { background-color: #f1f5f9; }
        .submit-btn {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="form-card">
        <h1>Find Nearby Schools</h1>
        <p>Enter your information to get started.</p>

        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="your name " required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" min="7" max="25" placeholder="15" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="student@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Contact number" required>
            </div>

            <div class="location-section">
                <div class="location-text" id="locationStatus">Location not detected yet</div>
                <button type="button" class="location-btn" id="locationBtn">Get Location</button>
            </div>

            <button type="submit" class="submit-btn">Search Schools</button>
        </form>
    </div>

    <script>
        const locationBtn = document.getElementById('locationBtn');
        const locationStatus = document.getElementById('locationStatus');
        const registrationForm = document.getElementById('registrationForm');

        // Setup default coordinates (Bengaluru fallback)
        let currentLat = 12.9716;
        let currentLon = 77.5946;

        locationBtn.addEventListener('click', () => {
            if (navigator.geolocation) {
                locationStatus.innerText = "Detecting...";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        locationStatus.innerHTML = "<span style='color: #16a34a;'>✅ Location saved</span>";
                    },
                    () => {
                        locationStatus.innerHTML = "<span style='color: #ea580c;'>⚠️ Using default location</span>";
                    }
                );
            } else {
                locationStatus.innerText = "Not supported by browser";
            }
        });

        registrationForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // Save the essential search coordinates and student name to session memory
            sessionStorage.setItem('studentName', document.getElementById('name').value);
            sessionStorage.setItem('searchLat', currentLat);
            sessionStorage.setItem('searchLon', currentLon);

            // Redirect the browser to the separate results web page
            window.location.href = 'results.html';
        });
    </script>
</body>
</html>
